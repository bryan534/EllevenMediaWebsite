<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "Organization",
						"@id": "https://ellevenmediagroup.com/#organization",
						"name": "Elleven Media",
						"alternateName": "Elleven Media Group",
						"url": "https://ellevenmediagroup.com/",
						"logo": {
							"@type": "ImageObject",
							"url": "https://ellevenmediagroup.com/logo.png",
							"width": 400,
							"height": 100
						},
						"image": "https://ellevenmediagroup.com/og-image.png",
						"email": "hello@ellevenmediagroup.com",
						"address": {
							"@type": "PostalAddress",
							"addressRegion": "CA",
							"addressCountry": "US"
						},
						"contactPoint": {
							"@type": "ContactPoint",
							"contactType": "customer service",
							"email": "hello@ellevenmediagroup.com",
							"url": "https://ellevenmediagroup.com/contact"
						},
						"sameAs": [
							"https://www.instagram.com/ellevenmediagroup"
						]
					},
					{
						"@type": "WebSite",
						"@id": "https://ellevenmediagroup.com/#website",
						"name": "Elleven Media",
						"url": "https://ellevenmediagroup.com/",
						"description": "Premium web design and digital media studio for individuals and growing brands.",
						"publisher": {
							"@id": "https://ellevenmediagroup.com/#organization"
						}
					}
				]
			}
		</script>
		<style>
			/* Intro gate: content is visible by default and only hidden while the
			   homepage intro is about to play (class set by the inline script below). */
			.page-content{transition:opacity .45s ease}
			html.preloading .page-content{opacity:0}
			html.preloading body{overflow:hidden}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>try{var d=document.documentElement,r=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;if(location.pathname==='/'&&!r&&!sessionStorage.getItem('elleven_preloader_seen')){d.classList.add('preloading');setTimeout(function(){d.classList.remove('preloading')},3000)}}catch(e){}</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
